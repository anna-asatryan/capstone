# Syncs codes/summary_app/ → standalone summary-app repo.
# This repo will be activated once 100+ participant data is collected.
# Until then the workflow runs but the target repo stays minimal.
#
# SETUP REQUIRED (one-time):
#   1. Create target repo: github.com/anna-asatryan/capstone-summary-app
#   2. Generate a PAT with repo scope → add as secret SUMMARY_SYNC_PAT
#      (Settings → Secrets → Actions in the capstone repo)
#
# When experiment data arrives:
#   - Export CSVs from Supabase into artifacts/frozen/experiment_exports/
#   - Run `python run.py --mode frozen` to generate summary outputs
#   - Commit updated codes/summary_app/ → this workflow syncs automatically

name: Sync summary app to standalone repo

on:
  push:
    branches: [main]
    paths:
      - "codes/summary_app/**"
      - "artifacts/frozen/experiment_exports/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout capstone (source)
        uses: actions/checkout@v4

      - name: Checkout summary-app (target)
        uses: actions/checkout@v4
        with:
          repository: anna-asatryan/capstone-summary-app
          token: ${{ secrets.SUMMARY_SYNC_PAT }}
          path: target

      - name: Sync summary app into target root
        run: |
          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".gitignore" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            codes/summary_app/ \
            target/

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_SYNC_PAT }}
        run: |
          cd target
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet && echo "No changes to sync." && exit 0
          git commit -m "Sync summary app from capstone [skip ci]"
          CLEAN_TOKEN=$(printf "%s" "$GH_TOKEN")
          git remote set-url origin "https://${CLEAN_TOKEN}@github.com/anna-asatryan/capstone-summary-app.git"
          git push origin HEAD:main
